[project]
name = "autumn-local"
version = "0.2.0"
description = "Autumn local Windows assistant — typed action engine"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --tb=short --basetemp=.cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py", "tools/phase1_*.py", "packaging/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
